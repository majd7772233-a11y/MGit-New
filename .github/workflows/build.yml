name: Build

on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:
  
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      # Decode my_keystore.jks from GitHub Secret
      - name: Decode signing keystore
        shell: bash
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/my_keystore.jks"
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      # Build, test and sign release APK
      - name: Build, test and sign release APK
        shell: bash
        run: |
          ./gradlew --no-daemon testDebugUnitTest assembleRelease \
            -Pspecial=true \
            -Pkeystore="$RUNNER_TEMP/my_keystore.jks" \
            -Palias="$KEY_ALIAS" \
            -PstorePassword="$STORE_PASSWORD" \
            -PkeyPassword="$KEY_PASSWORD"
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: mgit-release-apk
          path: app/build/outputs/apk/release/*.apk
